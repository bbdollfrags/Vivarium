<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vivarium — an ouroboros in motion." />
    <title>Vivarium</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      .mark {
        position: relative;
        display: grid;
        place-items: center;
        width: min(90vmin, 52rem);
        aspect-ratio: 1;
      }

      .ouroboros {
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: orbit 30s linear infinite reverse;
        backface-visibility: hidden;
        transform: translateZ(0);
        will-change: transform;
        user-select: none;
      }

      .wordmark {
        position: absolute;
        z-index: 1;
        margin: 0;
        color: #eeeeee;
        font-size: clamp(1.45rem, 5.1vmin, 3.65rem);
        font-weight: 300;
        letter-spacing: 0.38em;
        line-height: 1;
        text-indent: 0.38em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }

      @keyframes orbit {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ouroboros {
          animation-play-state: paused;
        }
      }
    </style>
  </head>
  <body>
    <main class="mark" aria-label="Vivarium">
      <img class="ouroboros" src="ouroboros.png" alt="Silver ouroboros ring" />
      <h1 class="wordmark">Vivarium</h1>
    </main>
  </body>
</html>
